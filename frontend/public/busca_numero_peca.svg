<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C9AA6"/>
      <stop offset="100%" stop-color="#047986"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EDFE0"/>
      <stop offset="100%" stop-color="#55C4C7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0B6F78" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Cartão / peça -->
  <g filter="url(#softShadow)">
    <rect x="208" y="286" width="500" height="360" rx="42"
          fill="url(#aqua)" stroke="#FFFFFF" stroke-width="14"/>
    <rect x="250" y="334" width="416" height="84" rx="18"
          fill="#FFFFFF" opacity=".88"/>
    <rect x="250" y="446" width="250" height="28" rx="14"
          fill="#FFFFFF" opacity=".75"/>
    <rect x="250" y="500" width="330" height="28" rx="14"
          fill="#FFFFFF" opacity=".65"/>
    <rect x="250" y="554" width="180" height="28" rx="14"
          fill="#FFFFFF" opacity=".55"/>
  </g>

  <!-- Lupa -->
  <g transform="translate(586 500)" filter="url(#softShadow)">
    <circle cx="92" cy="92" r="96"
            fill="#FFFFFF" opacity=".98"/>
    <circle cx="92" cy="92" r="66"
            fill="none" stroke="url(#teal)" stroke-width="28"/>
    <path d="M145 145 L246 246"
          fill="none" stroke="#FFFFFF" stroke-width="58"
          stroke-linecap="round"/>
    <path d="M145 145 L246 246"
          fill="none" stroke="url(#teal)" stroke-width="36"
          stroke-linecap="round"/>
  </g>

  <!-- Detalhes -->
  <circle cx="780" cy="328" r="14" fill="#55C4C7" opacity=".75"/>
  <circle cx="818" cy="368" r="9" fill="#0C9AA6" opacity=".55"/>
</svg>